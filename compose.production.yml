# Separate from docker-compose.yml (development). No deployment runs automatically.
# Bot/API only: docker compose -f compose.production.yml up -d bot
# Full stack (bot + web): docker compose --profile full -f compose.production.yml up -d
services:
  bot:
    image: ${BOT_IMAGE:-tournamenthub-bot:local}
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: runner
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${BOT_ENV_FILE:-./deploy/bot.env}
    environment:
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "${BOT_BIND_ADDRESS:-127.0.0.1}:${BOT_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    profiles:
      - full
    image: ${WEB_IMAGE:-tournamenthub-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      bot:
        condition: service_healthy
    env_file:
      - ${WEB_ENV_FILE:-./deploy/web.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BOT_API_URL: "${BOT_API_URL:-http://bot:8080}"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/apps/web/.next/cache:size=64m,uid=1001,gid=1001,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
