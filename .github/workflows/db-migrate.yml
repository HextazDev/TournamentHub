name: DB migrations (Supabase)

# Migrations are applied from supabase/migrations/ via the Supabase CLI.
# - staging: applied automatically on every push to `staging`.
# - prod (main): the job runs in the protected `production` environment and
#   WAITS FOR MANUAL APPROVAL (Settings -> Environments -> production ->
#   required reviewers). Migrations are never auto-applied to prod.
#
# Required repository secrets:
#   SUPABASE_PROJECT_REF_STAGING / SUPABASE_DB_PASSWORD_STAGING
#   SUPABASE_PROJECT_REF_PROD    / SUPABASE_DB_PASSWORD_PROD

on:
  push:
    branches: [main, staging]

permissions: {}

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-staging:
    name: Apply migrations to STAGING (automatic)
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Push local migrations to staging DB
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
          DB_REF: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
        run: |
          ENC_PW=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          DB_URL="postgresql://postgres:${ENC_PW}@db.${DB_REF}.supabase.co:5432/postgres"
          supabase db push --db-url "$DB_URL"

  migrate-prod:
    name: Apply migrations to PROD (requires approval)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Push local migrations to prod DB
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          DB_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
        run: |
          ENC_PW=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          DB_URL="postgresql://postgres:${ENC_PW}@db.${DB_REF}.supabase.co:5432/postgres"
          supabase db push --db-url "$DB_URL"
