name: DB migrations (Supabase — manual replay)

# Automatic migrations on push to `main` / `staging` run inside
# `.github/workflows/docker-bot.yml` (job `migrate-db`), strictly AFTER
# `validate-monorepo` + `docker-bot` + `docker-web` succeed and strictly BEFORE
# `promote-tags` moves `:prod` / `:staging`.
#
# This standalone workflow is kept for manual replay / recovery via `workflow_dispatch`.
#
# Required repository secrets:
#   SUPABASE_PROJECT_REF_STAGING / SUPABASE_DB_PASSWORD_STAGING
#   SUPABASE_PROJECT_REF_PROD    / SUPABASE_DB_PASSWORD_PROD
#
# CONNECTION: shared POOLER in SESSION MODE (port 5432 on aws-0-eu-west-1.pooler.supabase.com).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target Supabase environment"
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

concurrency:
  group: db-migrate-manual-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to ${{ inputs.target }} (manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Push local migrations to ${{ inputs.target }} DB
        env:
          TARGET: ${{ inputs.target }}
          DB_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          DB_PASSWORD_PROD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          DB_REF_STAGING: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
          DB_PASSWORD_STAGING: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
        run: |
          if [[ "${TARGET}" == "prod" ]]; then
            DB_REF="${DB_REF_PROD}"
            DB_PASSWORD="${DB_PASSWORD_PROD}"
          elif [[ "${TARGET}" == "staging" ]]; then
            DB_REF="${DB_REF_STAGING}"
            DB_PASSWORD="${DB_PASSWORD_STAGING}"
          else
            echo "Unsupported target: ${TARGET}"
            exit 1
          fi
          export DB_REF DB_PASSWORD
          test -n "${DB_REF}" || { echo "Missing Supabase project ref secret for ${TARGET}"; exit 1; }
          test -n "${DB_PASSWORD}" || { echo "Missing Supabase DB password secret for ${TARGET}"; exit 1; }
          ENC_PW=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          DB_URL="postgresql://postgres.${DB_REF}:${ENC_PW}@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require"
          supabase db push --db-url "$DB_URL" --yes
