name: Validate and publish production containers
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-monorepo:
    name: Validate Monorepo Before Container Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=@hub/shared
      - name: Run unit tests
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy_key_for_ci
        run: npm run test
      - name: Run lint and typecheck
        run: make lint
      - name: Build monorepo workspaces
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy_key_for_ci
        run: npm run build

  docker-bot:
    needs: [validate-monorepo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Build bot production image (no instance credentials)
        run: |
          docker build \
            --target runner \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f apps/bot/Dockerfile \
            -t tournamenthub-bot:check .
      - name: Check bot image contents and non-root user
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' tournamenthub-bot:check)" = node
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' tournamenthub-bot:check)" = "${GITHUB_SHA}"
          docker run --rm --network none --entrypoint sh tournamenthub-bot:check -ec '
            test -f dist/index.js
            test -f dist/deploy-commands.js
            test ! -d src
            test ! -d dist/__tests__
            node -e "require(\"@hub/shared\"); require(\"express\"); require(\"discord.js\"); require(\"@supabase/supabase-js\")"
            test ! -d /app/node_modules/typescript
            test ! -d /app/node_modules/vitest
          '
      - name: Missing bot configuration must fail before network access
        run: |
          set +e
          docker run --rm --network none tournamenthub-bot:check > startup.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'Invalid bot environment' startup.log
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified bot image by immutable SHA tag without rebuilding
        id: publish
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_IMAGE="ghcr.io/${OWNER_LC}/tournamenthub-bot"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          docker tag tournamenthub-bot:check "${REPO_IMAGE}:${SHA_TAG}"
          docker push "${REPO_IMAGE}:${SHA_TAG}"
          DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "${REPO_IMAGE}:${SHA_TAG}")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published bot image: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  docker-web:
    needs: [validate-monorepo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Build web production image (no instance credentials)
        run: |
          docker build \
            --target runner \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f apps/web/Dockerfile \
            -t tournamenthub-web:check .
      - name: Check web image contents and non-root user
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' tournamenthub-web:check)" = nextjs
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' tournamenthub-web:check)" = "${GITHUB_SHA}"
          docker run --rm --network none --entrypoint sh tournamenthub-web:check -ec '
            test -f server.js
            test -f start-production.mjs
            test -d .next/static
            test ! -d src
          '
      - name: Missing web configuration must fail before network access
        run: |
          set +e
          docker run --rm --network none tournamenthub-web:check > web-startup.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'Invalid web environment' web-startup.log
      - name: Validate Compose (bot-only and full profile) without starting services
        env:
          BOT_ENV_FILE: ./deploy/bot.env.example
          WEB_ENV_FILE: ./deploy/web.env.example
        run: |
          docker compose -f compose.production.yml config --quiet
          docker compose --profile full -f compose.production.yml config --quiet
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified web image by immutable SHA tag without rebuilding
        id: publish
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_IMAGE="ghcr.io/${OWNER_LC}/tournamenthub-web"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          docker tag tournamenthub-web:check "${REPO_IMAGE}:${SHA_TAG}"
          docker push "${REPO_IMAGE}:${SHA_TAG}"
          DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "${REPO_IMAGE}:${SHA_TAG}")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published web image: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  promote-tags:
    name: Atomically promote matching bot and web tags
    needs: [docker-bot, docker-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify ref still points to current commit (prevent stale tag overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF}" --jq '.sha')"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Ref ${GITHUB_REF} has advanced to ${CURRENT_SHA} (current run is ${GITHUB_SHA}); skipping mutable tag promotion."
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Atomically promote bot and web digests to mutable environment/release tag
        env:
          BOT_DIGEST: ${{ needs.docker-bot.outputs.digest }}
          WEB_DIGEST: ${{ needs.docker-web.outputs.digest }}
        run: |
          test -n "${BOT_DIGEST}"
          test -n "${WEB_DIGEST}"
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          BOT_REPO="ghcr.io/${OWNER_LC}/tournamenthub-bot"
          WEB_REPO="ghcr.io/${OWNER_LC}/tournamenthub-web"
          if [[ "${GITHUB_REF}" == "refs/heads/staging" ]]; then
            PROMO_TAG="staging"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            PROMO_TAG="prod"
          else
            PROMO_TAG="${GITHUB_REF#refs/tags/}"
          fi
          docker buildx imagetools create -t "${BOT_REPO}:${PROMO_TAG}" "${BOT_REPO}@${BOT_DIGEST#*@}"
          docker buildx imagetools create -t "${WEB_REPO}:${PROMO_TAG}" "${WEB_REPO}@${WEB_DIGEST#*@}"
          echo "Promoted \`${PROMO_TAG}\` for both bot (\`${BOT_DIGEST}\`) and web (\`${WEB_DIGEST}\`)." >> "$GITHUB_STEP_SUMMARY"
